# Integrated MAVLink control thread configuration.
enabled=1
debug=1

# Selects exactly one transport implementation:
#   udp    -> src/control/mavlink/mavlink_transport_udp.c
#   tcp    -> src/control/mavlink/mavlink_transport_tcp.c
#   serial -> src/control/mavlink/mavlink_transport_serial.c
transport=udp

system_id=1
component_id=191

# UDP receiver configuration
udp_bind_ip=0.0.0.0
udp_port=14550

# TCP configuration: server or client
tcp_mode=server
tcp_host=0.0.0.0
tcp_port=5760

# Serial configuration
serial_device=/dev/ttyUSB0
serial_baud=115200
